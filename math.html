<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percentage Calculator — CalcHub</title>
    <meta
      name="description"
      content="Find percentage of a number, percent change, and percent increase/decrease."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo">CalcHub</a>
        <nav>
          <a href="finance.html">Finance</a>
          <a href="health.html">Health</a>
          <a href="business.html">Business</a>
          <a href="realestate.html">Real Estate</a>
          <a href="construction.html">Construction</a>
          <a href="math.html">Math</a>
          <a href="date.html">Date</a>
          <a href="converter.html">Converter</a>
          <a href="food.html">Food</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <a href="index.html" class="back-link">← All calculators</a>

      <section class="calc-page">
        <h1>Percentage Calculator</h1>
        <p class="intro">What is X% of Y?</p>

        <div class="field">
          <label for="pct">Percentage (%)</label>
          <input type="number" id="pct" placeholder="15" step="0.01" />
        </div>
        <div class="field">
          <label for="of">Of number</label>
          <input type="number" id="of" placeholder="200" step="0.01" />
        </div>

        <button class="btn" data-calc="calcPercent">Calculate</button>
        <button class="btn btn-secondary" data-reset>Reset</button>

        <div class="notes">
          <h2>Also useful</h2>
          <p>Percent change = ((new − old) / old) × 100.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          © <span id="year"></span> CalcHub. For informational purposes only.
        </p>
      </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/percentage.js"></script>
  </body>
</html>
