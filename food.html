<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Scaler — CalcHub</title>
    <meta
      name="description"
      content="Scale recipe ingredient quantities up or down."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo">CalcHub</a>
        <nav>
          <a href="finance.html">Finance</a>
          <a href="health.html">Health</a>
          <a href="business.html">Business</a>
          <a href="realestate.html">Real Estate</a>
          <a href="construction.html">Construction</a>
          <a href="math.html">Math</a>
          <a href="date.html">Date</a>
          <a href="converter.html">Converter</a>
          <a href="food.html">Food</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <a href="index.html" class="back-link">← All calculators</a>

      <section class="calc-page">
        <h1>Recipe Scaler</h1>
        <p class="intro">Scale a recipe’s ingredient quantity.</p>

        <div class="field">
          <label for="qty">Original quantity</label>
          <input type="number" id="qty" placeholder="2" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="origServ">Original servings</label>
          <input
            type="number"
            id="origServ"
            placeholder="4"
            step="0.1"
            min="0"
          />
        </div>
        <div class="field">
          <label for="newServ">New servings</label>
          <input
            type="number"
            id="newServ"
            placeholder="6"
            step="0.1"
            min="0"
          />
        </div>

        <button class="btn" data-calc="calcRecipe">Calculate</button>
        <button class="btn btn-secondary" data-reset>Reset</button>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          © <span id="year"></span> CalcHub. For informational purposes only.
        </p>
      </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/recipe.js"></script>
  </body>
</html>
