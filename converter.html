<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter — CalcHub</title>
    <meta
      name="description"
      content="Convert length, weight, and temperature units."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo">CalcHub</a>
        <nav>
          <a href="finance.html">Finance</a>
          <a href="health.html">Health</a>
          <a href="business.html">Business</a>
          <a href="realestate.html">Real Estate</a>
          <a href="construction.html">Construction</a>
          <a href="math.html">Math</a>
          <a href="date.html">Date</a>
          <a href="converter.html">Converter</a>
          <a href="food.html">Food</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <a href="index.html" class="back-link">← All calculators</a>

      <section class="calc-page">
        <h1>Unit Converter</h1>
        <p class="intro">Convert length, weight, and temperature.</p>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temp">Temperature</option>
          </select>
        </div>
        <div class="field">
          <label for="value">Value</label>
          <input type="number" id="value" placeholder="1" step="0.0001" />
        </div>
        <div class="field">
          <label for="from">From</label>
          <select id="from"></select>
        </div>
        <div class="field">
          <label for="to">To</label>
          <select id="to"></select>
        </div>

        <button class="btn" data-calc="calcUnit">Convert</button>
        <button class="btn btn-secondary" data-reset>Reset</button>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          © <span id="year"></span> CalcHub. For informational purposes only.
        </p>
      </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/unit.js"></script>
  </body>
</html>
