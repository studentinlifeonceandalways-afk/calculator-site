<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator — CalcHub</title>
    <meta
      name="description"
      content="Calculate exact age in years, months, and days from a birth date."
